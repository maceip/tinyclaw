name: Smoke Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: tinyclaw
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tinyclaw.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p tinyclaw

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tinyclaw-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 7

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust JNI library
        run: cargo ndk -t arm64-v8a build --release -p tinyclaw-android

      - name: Copy .so into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libtinyclaw_android.so \
             android/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tinyclaw-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
